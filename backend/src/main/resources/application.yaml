server:
  port: 8080

spring:
  application:
    name: services

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:neighborhood_services}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  cors:
    allowed-origins: http://localhost:5173

  jwt:
    secret: "Y29tLm5laWdoYm9yaG9vZC5zZXJ2aWNlcy5qd3Quc2VjcmV0LmtleS5mb3IuZGV2ZWxvcG1lbnQ="
    expiration-ms: 86400000